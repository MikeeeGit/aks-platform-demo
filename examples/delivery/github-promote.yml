name: Private selected image build promotion
on:
  workflow_dispatch:
    inputs:
      build-run-id:
        description: Successful run ID from the selected trusted build workflow
        required: true
        type: string
      build-workflow:
        description: Expected workflow that produced the selected run
        required: true
        type: choice
        default: image-build.yml
        options: [image-build.yml, build-deploy.yml]
      target-clusters:
        description: Selected clusters in deployment order
        required: true
        type: choice
        default: '["aks01"]'
        options: ['["aks01"]', '["aks02"]', '["aks01","aks02"]', '["aks02","aks01"]']
      deploy-sequentially:
        description: Require the first cluster to succeed before the second
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  promote:
    # Keep both pins on the same reviewed shared-template commit.
    uses: MikeeeGit/aks-delivery-templates/.github/workflows/promote.yml@9fd0d6bd2e860c3f2e6a6aae4f154c8d3d309179
    with:
      template-ref: '9fd0d6bd2e860c3f2e6a6aae4f154c8d3d309179'
      build-run-id: ${{ inputs.build-run-id }}
      build-workflow: ${{ inputs.build-workflow }}
      client-id: ${{ vars.AZURE_AKS_DEPLOY_CLIENT_ID }}
      environment: pprd
      region: uks
      target-clusters: ${{ inputs.target-clusters }}
      deploy-sequentially: ${{ inputs.deploy-sequentially }}
      config: delivery.gateway.apps.json
      runs-on: '["self-hosted","linux","aks-private"]'
