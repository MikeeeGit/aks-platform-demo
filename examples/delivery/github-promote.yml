name: Private selected image build promotion
on:
  workflow_dispatch:
    inputs:
      build-run-id:
        description: Successful run ID from the selected trusted build workflow
        required: true
        type: string
      build-workflow:
        description: Expected workflow that produced the selected run
        required: true
        type: choice
        default: image-build.yml
        options: [image-build.yml, build-deploy.yml]
      cluster-slots:
        description: Selected slots in deployment order
        required: true
        type: choice
        default: '["aks01"]'
        options: ['["aks01"]', '["aks02"]', '["aks01","aks02"]', '["aks02","aks01"]']
      deploy-sequentially:
        description: Require the first slot to succeed before the second
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  promote:
    # Keep both pins on the same reviewed shared-template commit.
    uses: MikeeeGit/aks-delivery-templates/.github/workflows/promote.yml@f0034fd0f5a4f56271c514c439ca0e3795c56aae
    with:
      template-ref: 'f0034fd0f5a4f56271c514c439ca0e3795c56aae'
      build-run-id: ${{ inputs.build-run-id }}
      build-workflow: ${{ inputs.build-workflow }}
      client-id: ${{ vars.AZURE_AKS_DEPLOY_CLIENT_ID }}
      environment: pprd
      region: uks
      cluster-slots: ${{ inputs.cluster-slots }}
      deploy-sequentially: ${{ inputs.deploy-sequentially }}
      config: delivery.gateway.apps.json
      runs-on: '["self-hosted","linux","aks-private"]'
