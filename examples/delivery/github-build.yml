name: Private application image build
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  build:
    # Keep both pins on the same reviewed shared-template commit.
    uses: MikeeeGit/aks-delivery-templates/.github/workflows/build.yml@f0034fd0f5a4f56271c514c439ca0e3795c56aae
    with:
      template-ref: 'f0034fd0f5a4f56271c514c439ca0e3795c56aae'
      client-id: ${{ vars.AZURE_ACR_BUILD_CLIENT_ID }}
      config: delivery.gateway.apps.json
      build-environment: image-build
