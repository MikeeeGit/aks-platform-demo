name: Private application namespace bootstrap
on:
  workflow_dispatch:
    inputs:
      cluster-slots:
        description: Selected clusters requiring platform-owned application bootstrap
        required: true
        type: choice
        default: '["aks01"]'
        options: ['["aks01"]', '["aks02"]', '["aks01","aks02"]']
permissions:
  contents: read
  id-token: write
jobs:
  bootstrap:
    # Keep both pins on the same reviewed shared-template commit.
    uses: MikeeeGit/aks-delivery-templates/.github/workflows/bootstrap.yml@f0034fd0f5a4f56271c514c439ca0e3795c56aae
    with:
      template-ref: 'f0034fd0f5a4f56271c514c439ca0e3795c56aae'
      config: delivery.gateway.apps.json
      bootstrap-config: bootstrap.gateway.apps.json
      environment: pprd
      region: uks
      cluster-slots: ${{ inputs.cluster-slots }}
      client-id: ${{ vars.AZURE_AKS_BOOTSTRAP_CLIENT_ID }}
      runs-on: '["self-hosted","linux","aks-private"]'
