name: Private application namespace bootstrap
on:
  workflow_dispatch:
    inputs:
      cluster-slots:
        description: Selected clusters requiring platform-owned application bootstrap
        required: true
        type: choice
        default: '["aks01"]'
        options: ['["aks01"]', '["aks02"]', '["aks01","aks02"]']
permissions:
  contents: read
  id-token: write
jobs:
  bootstrap:
    # REPLACE both 40-zero pins with the same reviewed shared-template commit.
    uses: MikeeeGit/aks-delivery-templates/.github/workflows/bootstrap.yml@a7e98749fe35b5dc5bc263705e8f510832ca2a08
    with:
      template-ref: 'a7e98749fe35b5dc5bc263705e8f510832ca2a08'
      config: delivery.gateway.apps.json
      bootstrap-config: bootstrap.gateway.apps.json
      environment: pprd
      region: uks
      cluster-slots: ${{ inputs.cluster-slots }}
      client-id: ${{ vars.AZURE_AKS_BOOTSTRAP_CLIENT_ID }}
      runs-on: '["self-hosted","linux","aks-private"]'
