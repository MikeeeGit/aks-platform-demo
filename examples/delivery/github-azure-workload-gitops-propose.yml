name: Private Argo CD release proposal
on:
  workflow_dispatch:
    inputs:
      build-run-id:
        description: Successful run ID from the trusted image-build workflow
        required: true
        type: string
      target-cluster:
        description: One selected cluster; verify it before proposing the next
        required: true
        type: choice
        default: aks02
        options: [aks01, aks02]
permissions: {contents: read, actions: read}
jobs:
  propose:
    uses: MikeeeGit/aks-delivery-templates/.github/workflows/gitops-propose.yml@9fd0d6bd2e860c3f2e6a6aae4f154c8d3d309179
    with:
      template-ref: '9fd0d6bd2e860c3f2e6a6aae4f154c8d3d309179'
      build-run-id: ${{ inputs.build-run-id }}
      build-workflow: image-build.yml # Copy github-azure-workload-build.yml to this private workflow filename.
      environment: pprd
      region: uks
      target-cluster: ${{ inputs.target-cluster }}
      config: delivery.azure-workload.apps.json
      approval-environment: gitops-proposals
    secrets:
      gitops-token: ${{ secrets.GITOPS_PR_TOKEN }}
