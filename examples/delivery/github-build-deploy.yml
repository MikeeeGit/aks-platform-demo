name: Private build and selected slot deployment
on:
  workflow_dispatch:
    inputs:
      cluster-slots:
        description: Selected slots in deployment order
        required: true
        type: choice
        default: '["aks01"]'
        options: ['["aks01"]', '["aks02"]', '["aks01","aks02"]', '["aks02","aks01"]']
      deploy-sequentially:
        description: Require the first slot to succeed before the second
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
jobs:
  build:
    # REPLACE every 40-zero pin with one reviewed shared-template commit.
    uses: MikeeeGit/aks-delivery-templates/.github/workflows/build.yml@32e59a0fcd80dfcfeb0a24fc21c650d644d9da2d
    with:
      template-ref: '32e59a0fcd80dfcfeb0a24fc21c650d644d9da2d'
      client-id: ${{ vars.AZURE_ACR_BUILD_CLIENT_ID }}
      config: delivery.gateway.apps.json
      build-environment: image-build
  deploy:
    needs: build
    uses: MikeeeGit/aks-delivery-templates/.github/workflows/deploy-selected.yml@32e59a0fcd80dfcfeb0a24fc21c650d644d9da2d
    with:
      template-ref: '32e59a0fcd80dfcfeb0a24fc21c650d644d9da2d'
      source-commit: ${{ needs.build.outputs.source-commit }}
      image-digest: ${{ needs.build.outputs.image-digest }}
      client-id: ${{ vars.AZURE_AKS_DEPLOY_CLIENT_ID }}
      config: delivery.gateway.apps.json
      environment: pprd
      region: uks
      cluster-slots: ${{ inputs.cluster-slots }}
      deploy-sequentially: ${{ inputs.deploy-sequentially }}
      runs-on: '["self-hosted","linux","aks-private"]'
