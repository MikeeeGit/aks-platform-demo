name: Private build and selected slot deployment
on:
  workflow_dispatch:
    inputs:
      target-clusters:
        description: Selected clusters in deployment order
        required: true
        type: choice
        default: '["aks01"]'
        options: ['["aks01"]', '["aks02"]', '["aks01","aks02"]', '["aks02","aks01"]']
      deploy-sequentially:
        description: Require the first cluster to succeed before the second
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
jobs:
  build:
    # Keep every shared-template pin on the same reviewed commit.
    uses: MikeeeGit/aks-delivery-templates/.github/workflows/build.yml@9fd0d6bd2e860c3f2e6a6aae4f154c8d3d309179
    with:
      template-ref: '9fd0d6bd2e860c3f2e6a6aae4f154c8d3d309179'
      client-id: ${{ vars.AZURE_ACR_BUILD_CLIENT_ID }}
      config: delivery.gateway.apps.json
      build-environment: image-build
  deploy:
    needs: build
    uses: MikeeeGit/aks-delivery-templates/.github/workflows/deploy-selected.yml@9fd0d6bd2e860c3f2e6a6aae4f154c8d3d309179
    with:
      template-ref: '9fd0d6bd2e860c3f2e6a6aae4f154c8d3d309179'
      source-commit: ${{ needs.build.outputs.source-commit }}
      image-digest: ${{ needs.build.outputs.image-digest }}
      client-id: ${{ vars.AZURE_AKS_DEPLOY_CLIENT_ID }}
      config: delivery.gateway.apps.json
      environment: pprd
      region: uks
      target-clusters: ${{ inputs.target-clusters }}
      deploy-sequentially: ${{ inputs.deploy-sequentially }}
      runs-on: '["self-hosted","linux","aks-private"]'
