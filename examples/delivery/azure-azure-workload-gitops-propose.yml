trigger: none
pr: none
parameters:
  - name: buildRunId
    displayName: Successful image build run ID
    type: string
  - name: buildDefinitionId
    displayName: Expected trusted image build pipeline definition ID
    type: string
  - name: buildArtifact
    displayName: Receipt artifact from the selected image build
    type: string
    default: image-release-BuildApplication
    values: [image-release-BuildApplication, image-release-Application_Build]
  - name: targetCluster
    displayName: One selected cluster
    type: string
    default: aks02
    values: [aks01, aks02]
resources:
  repositories:
    - repository: aksTemplates
      type: git
      name: Platform/aks-delivery-templates # Replace the synthetic project name.
      ref: '9fd0d6bd2e860c3f2e6a6aae4f154c8d3d309179'
stages:
  - template: azure-pipelines/stages/gitops-propose.yml@aksTemplates
    parameters:
      buildRunId: ${{ parameters.buildRunId }}
      buildDefinitionId: ${{ parameters.buildDefinitionId }}
      buildArtifact: ${{ parameters.buildArtifact }}
      environment: pprd
      region: uks
      targetCluster: ${{ parameters.targetCluster }}
      configFile: delivery.azure-workload.apps.json
      approvalEnvironment: gitops-proposals
