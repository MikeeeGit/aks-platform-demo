name: Private Argo CD release proposal
on:
  workflow_dispatch:
    inputs:
      build-run-id:
        description: Successful run ID from the trusted image-build workflow
        required: true
        type: string
      cluster-slot:
        description: One selected slot; verify it before proposing the next
        required: true
        type: choice
        default: aks02
        options: [aks01, aks02]
permissions: {contents: read, actions: read}
jobs:
  propose:
    uses: MikeeeGit/aks-delivery-templates/.github/workflows/gitops-propose.yml@6eb3c083146afaeeacc75a2f3788ba15226fccc7
    with:
      template-ref: '6eb3c083146afaeeacc75a2f3788ba15226fccc7'
      build-run-id: ${{ inputs.build-run-id }}
      build-workflow: image-build.yml
      environment: pprd
      region: uks
      cluster-slot: ${{ inputs.cluster-slot }}
      config: delivery.gateway.apps.json
      approval-environment: gitops-proposals
    secrets:
      gitops-token: ${{ secrets.GITOPS_PR_TOKEN }}
