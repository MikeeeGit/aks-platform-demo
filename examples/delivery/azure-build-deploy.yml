trigger: none
pr: none
parameters:
  - name: targetClusters
    displayName: Selected clusters in deployment order
    type: object
    default: [aks01]
  - name: deploySequentially
    displayName: Require the first cluster to succeed before the second
    type: boolean
    default: true
resources:
  repositories:
    - repository: aksTemplates
      type: git
      name: Platform/aks-delivery-templates # REPLACE the synthetic project name.
      ref: '9fd0d6bd2e860c3f2e6a6aae4f154c8d3d309179' # Reviewed shared-template commit; update deliberately.
stages:
  - template: azure-pipelines/stages/build-deploy.yml@aksTemplates
    parameters:
      stageName: Application
      buildServiceConnection: example-acr-build-federated
      deployServiceConnection: example-aks-deploy-federated
      buildEnvironment: image-build
      environment: pprd
      region: uks
      targetClusters: ${{ parameters.targetClusters }}
      deploySequentially: ${{ parameters.deploySequentially }}
      configFile: delivery.gateway.apps.json
      buildPool: {vmImage: ubuntu-24.04}
      deployPool: {name: aks-private}
