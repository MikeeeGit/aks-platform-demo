name: Application CI
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          fetch-depth: 0
          persist-credentials: false
      - name: Determine validation scope
        id: scope
        run: python3 app/.github/ci_scope.py --source app
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.run-tests == 'true'
        with:
          repository: MikeeeGit/aks-delivery-templates
          ref: 6eb3c083146afaeeacc75a2f3788ba15226fccc7
          path: templates
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.scope.outputs.run-tests == 'true'
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Test application and release metadata
        if: steps.scope.outputs.run-tests == 'true'
        working-directory: app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          BUILD_REVISION="$GITHUB_SHA" npm run build
      - name: Install checked Kubernetes and Helm clients
        if: steps.scope.outputs.run-tests == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/pip" install --require-hashes -r templates/requirements.txt
          python3 templates/scripts/install_tools.py --directory "$RUNNER_TEMP/aks-tools"
      - name: Validate application overlays and render both slots
        if: steps.scope.outputs.run-tests == 'true'
        run: |
          export PATH="$RUNNER_TEMP/aks-tools:$PATH"
          "$RUNNER_TEMP/validation-python/bin/python" templates/scripts/validate_gitops.py --source app
          "$RUNNER_TEMP/validation-python/bin/python" -m unittest discover -s app/tests -p 'test_*.py' -v
          "$RUNNER_TEMP/validation-python/bin/python" templates/scripts/delivery.py validate --source app
          for profile in direct gateway azure-workload; do
            if [ "$profile" = gateway ]; then
              config=delivery.gateway.apps.json
              bootstrap=bootstrap.gateway.apps.json
            elif [ "$profile" = azure-workload ]; then
              config=delivery.azure-workload.apps.json
              bootstrap=bootstrap.gateway.apps.json
            else
              config=delivery.apps.json
              bootstrap=bootstrap.apps.json
            fi
            "$RUNNER_TEMP/validation-python/bin/python" templates/scripts/delivery.py validate --source app --config "$config"
            for slot in aks01 aks02; do
              "$RUNNER_TEMP/validation-python/bin/python" templates/scripts/bootstrap.py resolve --source app --config "$config" --bootstrap-config "$bootstrap" --environment pprd --region uks --slot "$slot"
              "$RUNNER_TEMP/validation-python/bin/python" templates/scripts/delivery.py render --source app --config "$config" --commit "$GITHUB_SHA" --digest "sha256:$(printf '%064d' 0)" --environment pprd --region uks --slot "$slot" --output "$RUNNER_TEMP/rendered-$profile-$slot"
            done
          done
      - name: Build and smoke-test the container without cloud credentials
        if: steps.scope.outputs.run-tests == 'true'
        working-directory: app
        run: |
          set -euo pipefail
          docker build --build-arg BUILD_REVISION="$GITHUB_SHA" --tag aks-platform-demo:ci .
          container=$(docker run --detach --rm --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=16m --publish 127.0.0.1:18080:8080 --env APP_SLOT=aks01 aks-platform-demo:ci)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs --url http://127.0.0.1:18080 --host web.example.test --expected-slot aks01 --expected-revision "$GITHUB_SHA"
      - name: "Worked example: deploy three tiers, switch traffic and remove"
        if: steps.scope.outputs.run-tests == 'true'
        run: |
          set -euo pipefail
          command -v openssl
          python3 app/scripts/install_ci_tools.py --directory "$RUNNER_TEMP/aks-tools"
          export PATH="$RUNNER_TEMP/aks-tools:$PATH"
          python3 app/scripts/run_worked_example.py --method direct --output "$RUNNER_TEMP/dual-cluster-evidence"
      - name: Retain Kubernetes acceptance evidence
        if: always() && steps.scope.outputs.run-tests == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dual-cluster-acceptance
          path: ${{ runner.temp }}/dual-cluster-evidence/
          if-no-files-found: ignore
          retention-days: 14

  argocd-acceptance:
    name: Argo CD dual-cluster acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          fetch-depth: 0
          persist-credentials: false
      - name: Determine validation scope
        id: scope
        run: python3 app/.github/ci_scope.py --source app
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.run-tests == 'true'
        with:
          repository: MikeeeGit/aks-delivery-templates
          ref: 6eb3c083146afaeeacc75a2f3788ba15226fccc7
          path: templates
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.scope.outputs.run-tests == 'true'
        with:
          node-version-file: app/.node-version
      - name: Install pinned test clients
        if: steps.scope.outputs.run-tests == 'true'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/pip" install --require-hashes -r templates/requirements.txt
          python3 templates/scripts/install_tools.py --directory "$RUNNER_TEMP/aks-tools"
          python3 app/scripts/install_ci_tools.py --directory "$RUNNER_TEMP/aks-tools"
      - name: Reconcile, promote, reject, recover and roll back through Argo CD
        if: steps.scope.outputs.run-tests == 'true'
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/aks-tools:$PATH"
          python3 app/scripts/run_worked_example.py --method argocd --output "$RUNNER_TEMP/argocd-evidence"
      - name: Retain Argo CD acceptance evidence
        if: always() && steps.scope.outputs.run-tests == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: argocd-dual-cluster-acceptance
          path: ${{ runner.temp }}/argocd-evidence/
          if-no-files-found: ignore
          retention-days: 14
