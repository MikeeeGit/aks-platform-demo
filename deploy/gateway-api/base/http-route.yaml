apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-demo
spec:
  parentRefs:
    - name: platform-demo-private
      sectionName: https-web
    - name: platform-demo-private
      sectionName: https-api
  hostnames:
    - web.example.test
    - api.example.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: platform-demo
          port: 80
