apiVersion: v1
kind: Service
metadata:
  name: platform-demo
  labels:
    app.kubernetes.io/name: platform-demo
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: platform-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
